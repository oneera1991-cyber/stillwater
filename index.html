<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stillwater</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <div class="logo">Still<span>water</span></div>
      <div>
        <button onclick="setLang('en')" style="background:none;border:none;cursor:pointer;font-weight:600;color:var(--green);">EN</button>
        <span style="color:var(--text-muted);">|</span>
        <button onclick="setLang('th')" style="background:none;border:none;cursor:pointer;color:var(--text-muted);">TH</button>
      </div>
    </div>
  </header>

  <div class="container" style="text-align: center; padding-top: 80px;">
    <div class="logo" style="font-size: 42px; margin-bottom: 8px;">Still<span>water</span></div>
    <p style="color: var(--text-muted); margin-bottom: 48px;" id="tagline"></p>

    <div style="max-width: 280px; margin: 0 auto;">
      <a href="signup.html" class="btn" id="signup-btn" style="margin-bottom: 12px;"></a>
      <a href="login.html" class="btn btn-outline" id="login-btn"></a>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const extra = {
      en: { tagline: "Understand your patterns. Understand your relationships.", signup: "Sign Up", login: "Log In" },
      th: { tagline: "เข้าใจรูปแบบของคุณ เข้าใจความสัมพันธ์ของคุณ", signup: "สมัครสมาชิก", login: "เข้าสู่ระบบ" }
    };
    Object.assign(translations.en, extra.en);
    Object.assign(translations.th, extra.th);

    document.getElementById('tagline').textContent = t('tagline');
    document.getElementById('signup-btn').textContent = t('signup');
    document.getElementById('login-btn').textContent = t('login');
  </script>
</body>
</html>
