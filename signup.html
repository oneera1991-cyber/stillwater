<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Stillwater</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <div class="logo">Still<span>water</span></div>
      <div>
        <button onclick="setLang('en')" style="background:none;border:none;cursor:pointer;font-weight:600;color:var(--green);">EN</button>
        <span style="color:var(--text-muted);">|</span>
        <button onclick="setLang('th')" style="background:none;border:none;cursor:pointer;color:var(--text-muted);">TH</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="card" style="margin-top: 32px;">
      <h2 id="signup-title"></h2>
      <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 14px;" id="signup-sub"></p>

      <form id="signup-form">
        <div class="form-group">
          <label id="email-label"></label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label id="password-label"></label>
          <input type="password" id="password" required minlength="6">
        </div>
        <button type="submit" class="btn" id="continue-btn"></button>
      </form>
      <p style="text-align: center; margin-top: 16px; font-size: 14px;">
        <a href="login.html" id="have-account"></a>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const extra = {
      en: {
        signupTitle: "Create your account",
        signupSub: "Start with your email",
        email: "Email",
        password: "Password",
        continue: "Continue",
        haveAccount: "Already have an account? Log in"
      },
      th: {
        signupTitle: "สร้างบัญชี",
        signupSub: "เริ่มต้นด้วยอีเมล",
        email: "อีเมล",
        password: "รหัสผ่าน",
        continue: "ดำเนินการต่อ",
        haveAccount: "มีบัญชีอยู่แล้ว? เข้าสู่ระบบ"
      }
    };
    Object.assign(translations.en, extra.en);
    Object.assign(translations.th, extra.th);

    document.getElementById('signup-title').textContent = t('signupTitle');
    document.getElementById('signup-sub').textContent = t('signupSub');
    document.getElementById('email-label').textContent = t('email');
    document.getElementById('password-label').textContent = t('password');
    document.getElementById('continue-btn').textContent = t('continue');
    document.getElementById('have-account').textContent = t('haveAccount');

    document.getElementById('signup-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const account = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };
      localStorage.setItem('stillwater_account', JSON.stringify(account));
      location.href = 'profile.html';
    });
  </script>
</body>
</html>
