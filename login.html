<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Stillwater</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <div class="logo">Still<span>water</span></div>
      <div>
        <button onclick="setLang('en')" style="background:none;border:none;cursor:pointer;font-weight:600;color:var(--green);">EN</button>
        <span style="color:var(--text-muted);">|</span>
        <button onclick="setLang('th')" style="background:none;border:none;cursor:pointer;color:var(--text-muted);">TH</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="card" style="margin-top: 32px;">
      <h2 id="login-title"></h2>
      <form id="login-form" style="margin-top: 20px;">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn" id="login-btn"></button>
      </form>
      <p style="text-align: center; margin-top: 16px; font-size: 14px;">
        <a href="signup.html" id="no-account"></a>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const extra = {
      en: { loginTitle: "Log In", loginBtn: "Log In", noAccount: "Don't have an account? Sign up" },
      th: { loginTitle: "เข้าสู่ระบบ", loginBtn: "เข้าสู่ระบบ", noAccount: "ยังไม่มีบัญชี? สมัครสมาชิก" }
    };
    Object.assign(translations.en, extra.en);
    Object.assign(translations.th, extra.th);

    document.getElementById('login-title').textContent = t('loginTitle');
    document.getElementById('login-btn').textContent = t('loginBtn');
    document.getElementById('no-account').textContent = t('noAccount');

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      // Prototype: just go to pattern if any profile exists
      if (localStorage.getItem('stillwater_user')) {
        location.href = 'pattern.html';
      } else {
        alert(currentLang === 'th' ? 'ยังไม่มีบัญชี กรุณาสมัครก่อน' : 'No account found. Please sign up first.');
      }
    });
  </script>
</body>
</html>
